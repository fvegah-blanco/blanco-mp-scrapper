<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MP Scrapper · Blanco</title>
<link rel="icon" href="logo-bf.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  /* Tokens de backoffice-fe/app/globals.css (HSL), claro y oscuro. */
  :root {
    --background: 0 0% 100%; --foreground: 226 32% 12%; --card: 0 0% 100%;
    --muted: 240 6% 96%; --muted-foreground: 224 8% 40%; --border: 220 13% 91%;
    --action: 238 63% 49%; --action-hover: 238 61% 54%; --link: 238 63% 49%; --ring: 238 63% 49%;
    --brand-signal: 14 82% 51%;
    --destructive-soft: 0 84% 95%; --destructive-text: 0 74% 42%;
    --warning-soft: 41 94% 93%; --warning-text: 34 87% 32%;
    --success-soft: 154 47% 93%; --success-text: 163 94% 24%;
    --info-soft: 238 80% 96%; --info-text: 238 63% 45%;
    --sidebar: 240 8% 97%; --sidebar-foreground: 224 8% 40%; --sidebar-accent: 240 6% 94%; --sidebar-border: 220 13% 91%;
    --logo-filter: none;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --background: 225 27% 9%; --foreground: 229 41% 95%; --card: 225 24% 13%;
      --muted: 226 23% 18%; --muted-foreground: 224 30% 82%; --border: 224 21% 22%;
      --action: 238 79% 64%; --action-hover: 238 87% 70%; --link: 238 100% 82%; --ring: 238 100% 82%;
      --brand-signal: 15 100% 72%;
      --destructive-soft: 338 23% 18%; --destructive-text: 0 100% 81%;
      --warning-soft: 33 27% 17%; --warning-text: 37 76% 71%;
      --success-soft: 168 38% 15%; --success-text: 156 63% 68%;
      --info-soft: 236 30% 20%; --info-text: 238 100% 85%;
      --sidebar: 224 26% 11%; --sidebar-foreground: 224 30% 82%; --sidebar-accent: 226 23% 18%; --sidebar-border: 224 21% 22%;
      --logo-filter: invert(1);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --background: 225 27% 9%; --foreground: 229 41% 95%; --card: 225 24% 13%;
    --muted: 226 23% 18%; --muted-foreground: 224 30% 82%; --border: 224 21% 22%;
    --action: 238 79% 64%; --action-hover: 238 87% 70%; --link: 238 100% 82%; --ring: 238 100% 82%;
    --brand-signal: 15 100% 72%;
    --destructive-soft: 338 23% 18%; --destructive-text: 0 100% 81%;
    --warning-soft: 33 27% 17%; --warning-text: 37 76% 71%;
    --success-soft: 168 38% 15%; --success-text: 156 63% 68%;
    --info-soft: 236 30% 20%; --info-text: 238 100% 85%;
    --sidebar: 224 26% 11%; --sidebar-foreground: 224 30% 82%; --sidebar-accent: 226 23% 18%; --sidebar-border: 224 21% 22%;
    --logo-filter: invert(1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: hsl(var(--background)); color: hsl(var(--foreground)); font: 14px/20px Geist, Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; display: flex; overflow: hidden; }
  svg.i { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid hsl(var(--ring)); outline-offset: 2px; border-radius: 6px; }

  /* ── Sidebar (components/sidebar.tsx) ─────────────────────────────── */
  aside { width: 240px; height: 100vh; flex-shrink: 0; display: flex; flex-direction: column; background: hsl(var(--sidebar)); border-right: 1px solid hsl(var(--sidebar-border)); transition: width .2s ease; }
  aside.plegado { width: 64px; }
  .sb-cabecera { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 16px; border-bottom: 1px solid hsl(var(--sidebar-border) / .5); }
  .sb-boton { width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; color: hsl(var(--muted-foreground)); cursor: pointer; flex-shrink: 0; }
  .sb-boton:hover { background: hsl(var(--sidebar-accent)); color: hsl(var(--foreground)); }
  .sb-marca { min-width: 0; overflow: hidden; white-space: nowrap; transition: opacity .2s; }
  .sb-marca img { display: block; width: 100px; height: auto; margin-bottom: 2px; filter: var(--logo-filter); }
  .sb-marca p { margin: 0; font-size: 12px; line-height: 16px; color: hsl(var(--muted-foreground)); }
  .sb-isotipo { display: none; width: 28px; height: 28px; filter: var(--logo-filter); }
  aside.plegado .sb-marca, aside.plegado .fade { opacity: 0; width: 0; pointer-events: none; }
  aside.plegado .sb-isotipo { display: block; }
  aside.plegado .sb-cabecera { justify-content: center; padding: 0; }
  aside.plegado #plegar { display: none; }
  nav { flex: 1; overflow-y: auto; padding: 8px 16px; }
  aside.plegado nav { padding: 8px 16px; }
  .sb-seccion { position: relative; height: 32px; display: flex; align-items: center; padding: 0 8px; }
  .sb-seccion span { font-size: 12px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: hsl(var(--muted-foreground)); white-space: nowrap; transition: opacity .2s; }
  aside.plegado .sb-seccion::before { content: ""; position: absolute; left: 8px; right: 8px; top: 50%; height: 1px; background: hsl(var(--sidebar-border)); }
  .sb-item { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 8px; margin-bottom: 1px; border-radius: 6px; font-size: 14px; font-weight: 500; color: hsl(var(--muted-foreground)); text-decoration: none; white-space: nowrap; overflow: hidden; transition: background .2s, color .2s; }
  .sb-item:hover { background: hsl(var(--sidebar-accent)); color: hsl(var(--foreground)); }
  .sb-item[aria-current="page"] { color: hsl(var(--foreground)); font-weight: 600; box-shadow: inset 2px 0 0 hsl(var(--brand-signal)); }
  .sb-item .fade { transition: opacity .2s; flex: 1; overflow: hidden; text-overflow: ellipsis; }
  aside.plegado .sb-item { gap: 0; }
  .sb-pie { border-top: 1px solid hsl(var(--sidebar-border) / .5); padding: 8px 16px 12px; }
  .sb-pie .sb-item { cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; }
  .sb-llave { margin: 4px 0 0; }
  .sb-llave input { width: 100%; height: 32px; padding: 0 8px; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--background)); font-size: 13px; }
  aside.plegado .sb-llave { display: none; }

  /* ── Contenido (ListPageShell + PageHeader) ───────────────────────── */
  main { flex: 1; min-width: 0; height: 100vh; overflow-y: auto; }
  .pagina { max-width: 1152px; margin: 0 auto; padding: 24px; }
  .encabezado { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; border-bottom: 1px solid hsl(var(--border)); padding-bottom: 16px; margin-bottom: 16px; }
  .encabezado .titulo { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .icono-caja { width: 36px; height: 36px; display: inline-flex; align-items: center; justify-content: center; border-radius: 6px; background: hsl(var(--muted)); color: hsl(var(--foreground)); flex-shrink: 0; }
  h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.025em; }
  .descripcion { margin: 2px 0 0; font-size: 14px; color: hsl(var(--muted-foreground)); }
  .acciones { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .filtros { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .filtros input, .filtros select, .campo { height: 36px; padding: 0 12px; border: 1px solid hsl(var(--border)); border-radius: 6px; background: hsl(var(--background)); font-size: 14px; }

  /* Botones (components/ui/button.tsx) */
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; border-radius: 6px; font-size: 14px; font-weight: 500; cursor: pointer; border: 1px solid hsl(var(--border)); background: hsl(var(--background)); color: hsl(var(--foreground)); white-space: nowrap; }
  .btn:hover { background: hsl(var(--muted)); }
  .btn.primario { background: hsl(var(--action)); border-color: transparent; color: #fff; }
  .btn.primario:hover { background: hsl(var(--action-hover)); }
  .btn.fantasma { border-color: transparent; background: transparent; padding: 0 8px; }
  .btn.fantasma:hover { background: hsl(var(--muted)); }
  .btn:disabled { opacity: .5; cursor: default; }

  /* Tarjetas KPI */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .kpi { border: 1px solid hsl(var(--border)); border-radius: 12px; background: hsl(var(--card)); padding: 16px; }
  .kpi .k { font-size: 12px; line-height: 16px; color: hsl(var(--muted-foreground)); font-weight: 500; }
  .kpi .v { font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 12px; line-height: 16px; color: hsl(var(--muted-foreground)); margin-top: 4px; }

  /* Tabla (components/ui/table.tsx) */
  .tabla { border: 1px solid hsl(var(--border)); border-radius: 6px; overflow-x: auto; background: hsl(var(--card)); }
  table { width: 100%; min-width: 720px; border-collapse: collapse; font-size: 14px; }
  th { height: 40px; padding: 0 12px; text-align: left; font-weight: 500; color: hsl(var(--muted-foreground)); border-bottom: 1px solid hsl(var(--border)); white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid hsl(var(--border)); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  tbody tr:hover { background: hsl(var(--muted) / .5); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sub { display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: hsl(var(--muted-foreground)); }
  .nowrap { white-space: nowrap; }
  code, .mono { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; }
  code { background: hsl(var(--muted)); padding: 2px 6px; border-radius: 4px; }
  a { color: hsl(var(--link)); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .vacio { padding: 32px; text-align: center; color: hsl(var(--muted-foreground)); }

  /* Badge (components/ui/badge.tsx, variante outline con tono) */
  .badge { display: inline-flex; align-items: center; border-radius: 6px; border: 1px solid transparent; padding: 1px 8px; font-size: 12px; line-height: 18px; font-weight: 600; white-space: nowrap; }
  .badge.ok { background: hsl(var(--success-soft)); color: hsl(var(--success-text)); }
  .badge.warn { background: hsl(var(--warning-soft)); color: hsl(var(--warning-text)); }
  .badge.err { background: hsl(var(--destructive-soft)); color: hsl(var(--destructive-text)); }
  .badge.info { background: hsl(var(--info-soft)); color: hsl(var(--info-text)); }
  .badge.neutro { border-color: hsl(var(--border)); color: hsl(var(--muted-foreground)); }

  /* Grilla de meses del backfill */
  .meses { display: grid; grid-template-columns: 88px repeat(12, minmax(64px, 1fr)); gap: 6px; min-width: 900px; padding: 12px; }
  .mes { border: 1px solid hsl(var(--border)); border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; line-height: 16px; }
  .mes b { display: block; font-weight: 600; }
  .mes.OK { background: hsl(var(--success-soft)); color: hsl(var(--success-text)); border-color: transparent; }
  .mes.ERROR { background: hsl(var(--destructive-soft)); color: hsl(var(--destructive-text)); border-color: transparent; }
  .mes.PROCESANDO, .mes.DESCARGANDO { background: hsl(var(--info-soft)); color: hsl(var(--info-text)); border-color: transparent; }
  .mes.FALTA, .mes.PENDIENTE { color: hsl(var(--muted-foreground)); }
  .mes .btn { height: 24px; padding: 0 8px; font-size: 12px; margin-top: 4px; }
  .cab-mes { text-align: center; font-size: 12px; color: hsl(var(--muted-foreground)); }

  /* Aviso (toast) */
  #aviso { position: fixed; right: 24px; bottom: 24px; max-width: 420px; padding: 12px 16px; border-radius: 8px; border: 1px solid hsl(var(--border)); background: hsl(var(--card)); box-shadow: 0 8px 24px rgb(0 0 0 / .12); font-size: 14px; z-index: 50; }
  #aviso.err { background: hsl(var(--destructive-soft)); color: hsl(var(--destructive-text)); border-color: transparent; }

  /* Sheet lateral (historial) y diálogo (horario) */
  dialog { border: 1px solid hsl(var(--border)); background: hsl(var(--card)); color: hsl(var(--foreground)); padding: 0; }
  dialog::backdrop { background: rgb(0 0 0 / .5); }
  dialog.sheet { margin: 0 0 0 auto; height: 100vh; max-height: 100vh; width: min(560px, 100vw); border-width: 0 0 0 1px; }
  dialog.modal { border-radius: 12px; width: min(440px, 92vw); }
  .dlg-cab { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid hsl(var(--border)); }
  .dlg-cab h2 { margin: 0; font-size: 16px; font-weight: 600; }
  .dlg-cuerpo { padding: 16px 24px; overflow-y: auto; max-height: calc(100vh - 64px); }
  .dlg-pie { display: flex; justify-content: flex-end; gap: 8px; padding: 0 24px 16px; }
  .corrida { border: 1px solid hsl(var(--border)); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .corrida .fila { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .corrida pre { margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; font-family: "Geist Mono", monospace; font-size: 11px; color: hsl(var(--muted-foreground)); }
  label.etq { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; }

  @media (max-width: 760px) {
    aside { width: 64px; } aside .sb-marca, aside .fade, aside .sb-llave { opacity: 0; width: 0; display: none; }
    aside .sb-isotipo { display: block; } aside .sb-cabecera { justify-content: center; padding: 0; } aside #plegar { display: none; }
    .pagina { padding: 16px; } .encabezado { flex-direction: column; }
  }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <!-- Íconos lucide (los mismos del back office), inline para no depender de un CDN -->
  <symbol id="i-panel-close" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></symbol>

  <symbol id="i-dashboard" viewBox="0 0 24 24"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></symbol>
  <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></symbol>

 <symbol id="i-coins" viewBox="0 0 24 24"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></symbol>

</svg>

<aside id="sidebar" aria-label="Menú">
  <div class="sb-cabecera">
    <button class="sb-boton" id="plegar" type="button" aria-label="Plegar menú" title="Plegar menú"><svg class="i"><use href="#i-panel-close"/></svg></button>
    <button class="sb-boton sb-isotipo-btn" id="desplegar" type="button" aria-label="Expandir menú" title="Expandir menú" style="display:none"><img class="sb-isotipo" src="logo-bf.svg" alt="Blanco" /></button>
    <div class="sb-marca">
      <img src="logo-full.svg" alt="Blanco Financiero" width="100" height="22" />
      <p>Mercado Público · Scrapper</p>
    </div>
  </div>
  <nav id="menu">
    <div class="sb-seccion"><span class="fade">Monitoreo</span></div>
    <a class="sb-item" href="#/resumen" data-ruta="resumen" title="Resumen"><svg class="i"><use href="#i-dashboard"/></svg><span class="fade">Resumen</span></a>
    <a class="sb-item" href="#/gasto-ia" data-ruta="gasto-ia" title="Gasto IA"><svg class="i"><use href="#i-coins"/></svg><span class="fade">Gasto IA</span></a>
    <div class="sb-seccion"><span class="fade">Resultados</span></div>
    <a class="sb-item" href="#/adjudicaciones" data-ruta="adjudicaciones" title="Adjudicaciones"><svg class="i"><use href="#i-award"/></svg><span class="fade">Adjudicaciones</span></a>
    <a class="sb-item" href="#/contactos" data-ruta="contactos" title="Contactos"><svg class="i"><use href="#i-users"/></svg><span class="fade">Contactos</span></a>
    <div class="sb-seccion"><span class="fade">Ingesta</span></div>
    <a class="sb-item" href="#/datos-abiertos" data-ruta="datos-abiertos" title="Datos abiertos"><svg class="i"><use href="#i-database"/></svg><span class="fade">Datos abiertos</span></a>
    <div class="sb-seccion"><span class="fade">Administración</span></div>
    <a class="sb-item" href="#/cron-jobs" data-ruta="cron-jobs" title="Cron Jobs"><svg class="i"><use href="#i-clock"/></svg><span class="fade">Cron Jobs</span></a>
    <a class="sb-item" href="#/parametros" data-ruta="parametros" title="Parámetros"><svg class="i"><use href="#i-settings"/></svg><span class="fade">Parámetros</span></a>
  </nav>
  <div class="sb-pie">
    <button class="sb-item" id="tema" type="button" title="Cambiar tema"><svg class="i" id="temaIcono"><use href="#i-moon"/></svg><span class="fade" id="temaTexto">Tema oscuro</span></button>

  </div>
</aside>

<main id="contenido"><div class="pagina" id="pagina"></div></main>
<div id="aviso" role="status" hidden></div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitulo">
  <div class="dlg-cab"><h2 id="sheetTitulo"></h2><button class="btn fantasma" data-cerrar aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
  <div class="dlg-cuerpo" id="sheetCuerpo"></div>
</dialog>
<dialog class="modal" id="modal" aria-labelledby="modalTitulo">
  <form method="dialog" id="modalForm">
    <div class="dlg-cab"><h2 id="modalTitulo">Editar horario</h2><button class="btn fantasma" value="cancelar" aria-label="Cerrar"><svg class="i"><use href="#i-x"/></svg></button></div>
    <div class="dlg-cuerpo">
      <label class="etq" for="modalCron">Expresión cron</label>
      <input class="campo mono" id="modalCron" style="width:100%" />
      <span class="sub">Vacío vuelve al horario por defecto del código. Ej.: <code>*/30 * * * *</code></span>
    </div>
    <div class="dlg-pie"><button class="btn" value="cancelar">Cancelar</button><button class="btn primario" value="guardar">Guardar</button></div>
  </form>
</dialog>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const leer = (k) => { try { return localStorage.getItem(k) ?? ''; } catch { return ''; } };
  const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (n) => n == null ? '—' : Number(n).toLocaleString('es-CL', { maximumFractionDigits: 0 });
  const fecha = (d) => d ? new Date(d).toLocaleString('es-CL', { dateStyle: 'short', timeStyle: 'short' }) : '—';
  const icono = (id) => `<svg class="i"><use href="#i-${id}"/></svg>`;
  const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];

  // ── Sidebar plegable (misma preferencia que el back office: sidebar_collapsed) ──
  const sidebar = $('#sidebar');
  const aplicarPlegado = (p) => { sidebar.classList.toggle('plegado', p); $('#desplegar').style.display = p ? '' : 'none'; guardar('sidebar_collapsed', p ? '1' : '0'); };
  aplicarPlegado(leer('sidebar_collapsed') === '1');
  $('#plegar').onclick = () => aplicarPlegado(true);
  $('#desplegar').onclick = () => aplicarPlegado(false);

  // ── Tema claro/oscuro ──
  const oscuroSistema = () => matchMedia('(prefers-color-scheme: dark)').matches;
  const temaActual = () => document.documentElement.dataset.theme || (oscuroSistema() ? 'dark' : 'light');
  function pintarTema() {
    const oscuro = temaActual() === 'dark';
    $('#temaIcono use').setAttribute('href', oscuro ? '#i-sun' : '#i-moon');
    $('#temaTexto').textContent = oscuro ? 'Tema claro' : 'Tema oscuro';
  }
  if (leer('tema')) document.documentElement.dataset.theme = leer('tema');
  pintarTema();
  $('#tema').onclick = () => { const t = temaActual() === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; guardar('tema', t); pintarTema(); };

  $('#llave').value = leer('llave');
  $('#llave').onchange = (e) => { guardar('llave', e.target.value); render(); };

  async function api(ruta, opciones = {}) {
    const res = await fetch('/api' + ruta, { ...opciones, headers: { 'content-type': 'application/json', 'x-admin-key': $('#llave').value, ...(opciones.headers || {}) } });
    const cuerpo = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(cuerpo.message || ('HTTP ' + res.status));
    return cuerpo;
  }
  function avisar(texto, error = false) {
    const a = $('#aviso'); a.hidden = false; a.className = error ? 'err' : ''; a.textContent = texto;
    clearTimeout(avisar.t); avisar.t = setTimeout(() => { a.hidden = true; }, 5000);
  }
  const badge = (tono, texto) => `<span class="badge ${tono}">${esc(texto)}</span>`;
  const estadoRun = (s) => ({ SUCCESS: badge('ok', 'Éxito'), FAILED: badge('err', 'Falló'), RUNNING: badge('info', 'Corriendo') }[s] || badge('neutro', s));

  function encabezado({ titulo, descripcion, icono: ic, acciones = '' }) {
    return `<header class="encabezado"><div class="titulo"><span class="icono-caja" aria-hidden="true">${icono(ic)}</span>
      <div><h1>${esc(titulo)}</h1>${descripcion ? `<p class="descripcion">${esc(descripcion)}</p>` : ''}</div></div>
      <div class="acciones">${acciones}</div></header>`;
  }

  // ── Vistas ──
  const vistas = {
    async resumen(p) {
      p.innerHTML = encabezado({ titulo: 'Resumen', descripcion: 'Lo ingerido desde Mercado Público: organismos, proveedores, procesos y contactos.', icono: 'dashboard', acciones: `<button class="btn" data-recargar>${icono('refresh')}Recargar</button>` }) + '<div class="kpis" id="kpis"></div>';
      const { data } = await api('/consultas/resumen');
      const suma = (a) => a.reduce((s, x) => s + x._count, 0);
      const por = (a, k, v) => a.filter((x) => x[k] === v).reduce((s, x) => s + x._count, 0);
      const t = (s) => s.toLowerCase().replace(/_/g, ' ');
      const kpis = [
        ['Organismos (deudores)', num(data.organismos), 'RUT compradores'],
        ['Proveedores (vendedores)', num(data.proveedores), 'RUT que vendieron u ofertaron'],
        ['Procesos', num(suma(data.procesos)), data.procesos.map((x) => `${t(x.tipo)}: ${num(x._count)}`).join(' · ')],
        ['Órdenes de compra', num(suma(data.ordenes)), data.ordenes.map((o) => `${o.fuente === 'BUSCADOR' ? 'tiempo real' : t(o.fuente)}: ${num(o._count)}`).join(' · ')],
        ['OC compra ágil sin cruzar', num(data.ocAgSinProceso), 'Pendientes de encontrar su COT'],
        ['Adjudicaciones', num(suma(data.adjudicaciones)), data.adjudicaciones.map((a) => `${t(a.origen)}: ${num(a._count)}`).join(' · ')],
        ['Documentos', num(suma(data.documentos)), `Con texto: ${num(por(data.documentos, 'extraccionEstado', 'OK'))}`],
        ['Contactos', num(suma(data.contactos)), `Comprador: ${num(por(data.contactos, 'rol', 'COMPRADOR'))} · Proveedor: ${num(por(data.contactos, 'rol', 'PROVEEDOR'))}`],
        ['Última OC en tiempo real', data.ultimaOcTiempoReal ? esc(data.ultimaOcTiempoReal.codigo) : '—', data.ultimaOcTiempoReal ? fecha(data.ultimaOcTiempoReal.fechaEnvio) : 'El poll aún no corre'],
      ];
      $('#kpis').innerHTML = kpis.map(([k, v, d]) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${v}</div><div class="d">${esc(d)}</div></div>`).join('');
    },

    async 'gasto-ia'(p) {
      const dias = leer('gasto_dias') || '30';
      p.innerHTML = encabezado({ titulo: 'Gasto IA', descripcion: 'Costo y tiempo de cada documento leído con Bedrock (Anexo N°1 y cotizaciones).', icono: 'coins', acciones: `
        <select class="campo" id="fDias" aria-label="Período">${[['7', 'Últimos 7 días'], ['30', 'Últimos 30 días'], ['90', 'Últimos 90 días']].map(([v, t]) => `<option value="${v}" ${v === dias ? 'selected' : ''}>${t}</option>`).join('')}</select>
        <button class="btn" data-recargar>${icono('refresh')}Recargar</button>` }) + `
        <div class="kpis" id="kpisIa"></div>
        <p class="sub" id="precioIa" style="margin:8px 0 20px"></p>
        <h2 style="font-size:16px;font-weight:600;margin:0 0 8px">Por día</h2>
        <div class="tabla" style="margin-bottom:20px"><table style="min-width:520px"><thead><tr><th>Día</th><th class="num">Documentos</th><th class="num">Con error</th><th class="num">Gasto</th><th class="num">Tiempo IA promedio</th></tr></thead><tbody id="tDia"></tbody></table></div>
        <h2 style="font-size:16px;font-weight:600;margin:0 0 8px">Por documento</h2>
        <div class="tabla"><table><thead><tr><th>Documento</th><th>Estado</th><th class="num">Extracción</th><th class="num">Bedrock</th><th class="num">Págs.</th><th class="num">Tokens (ent. / sal.)</th><th class="num">Costo</th><th class="num">Contactos</th></tr></thead><tbody id="tDocIa"></tbody></table></div>`;
      $('#fDias').onchange = (e) => { guardar('gasto_dias', e.target.value); render(); };
      const { data } = await api('/consultas/ia?dias=' + dias);
      const t = data.totales;
      const usd = (v, dec = 2) => v == null ? '—' : 'US$ ' + Number(v).toLocaleString('es-CL', { minimumFractionDigits: dec, maximumFractionDigits: dec });
      const clp = (v) => v == null ? '' : '≈ $ ' + num(v * data.precio.dolarClp) + ' CLP';
      const seg = (ms) => ms == null ? '—' : ms < 1000 ? Math.round(ms) + ' ms' : (ms / 1000).toLocaleString('es-CL', { maximumFractionDigits: 1 }) + ' s';
      const kpis = [
        ['Gasto del período', usd(t.costo_usd, 4), clp(t.costo_usd)],
        ['Documentos analizados', num(t.analizados), `Con error: ${num(t.con_error)} · En cola: ${num(t.pendientes)}`],
        ['Costo por documento', usd(t.costo_promedio_usd, 4), t.costo_promedio_usd ? `${num(1 / t.costo_promedio_usd)} documentos por US$ 1` : 'Sin análisis aún'],
        ['Tiempo Bedrock por documento', seg(t.ia_ms_promedio), `Mediana ${seg(t.ia_ms_p50)} · p95 ${seg(t.ia_ms_p95)}`],
        ['Extracción de texto / OCR', seg(t.extraccion_ms_promedio), 'Promedio por documento, antes de Bedrock'],
        ['Contactos encontrados por IA', num(t.contactos), t.contactos && t.costo_usd ? `${usd(t.costo_usd / t.contactos, 4)} por contacto` : '—'],
        ['Tokens', `${num(t.tokens_entrada)} / ${num(t.tokens_salida)}`, 'Entrada (texto + páginas como imagen) / salida'],
      ];
      $('#kpisIa').innerHTML = kpis.map(([k, v, d]) => `<div class="kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div><div class="d">${esc(d)}</div></div>`).join('');
      $('#precioIa').textContent = `Costo calculado con ${data.precio.modelo}: US$ ${data.precio.entradaUsdMtok} por millón de tokens de entrada y US$ ${data.precio.salidaUsdMtok} de salida (se cambia en Parámetros). Si falla, responde ${data.precio.respaldo} con su propio precio. Es una estimación; la cifra oficial es la factura de AWS.`;
      $('#tDia').innerHTML = data.porDia.map((d) => `<tr><td class="nowrap">${esc(d.dia)}</td><td class="num">${num(d.analizados)}</td><td class="num">${num(d.con_error)}</td><td class="num">${usd(d.costo_usd, 4)}</td><td class="num">${seg(d.ia_ms_promedio)}</td></tr>`).join('') || '<tr><td colspan="5" class="vacio">Sin análisis en el período</td></tr>';
      const estado = { OK: ['ok', 'Analizado'], ERROR: ['err', 'Error'], PENDIENTE: ['info', 'En cola'], NO_APLICA: ['neutro', 'No aplica'] };
      const origen = { OFERTA: 'Anexo del oferente', COTIZACION: 'Cotización', BASES: 'Bases' };
      $('#tDocIa').innerHTML = data.documentos.map((d) => `<tr>
        <td>${esc(d.nombre)}<span class="sub">${esc(d.proceso_codigo)} · ${esc(origen[d.origen] || d.origen)}${d.es_anexo_identificacion ? ' · Anexo N°1' : ''}${d.metodo_extraccion === 'OCR' ? ' · OCR' : ''}</span></td>
        <td>${badge(...(estado[d.analisis_ia_estado] || ['neutro', d.analisis_ia_estado]))}${d.analisis_ia_error ? `<span class="sub" title="${esc(d.analisis_ia_error)}">${esc(d.analisis_ia_error.slice(0, 40))}</span>` : ''}</td>
        <td class="num">${seg(d.extraccion_ms)}</td>
        <td class="num">${seg(d.analisis_ia_ms)}</td>
        <td class="num">${num(d.analisis_ia_paginas)}</td>
        <td class="num">${num(d.analisis_ia_tokens_entrada)} / ${num(d.analisis_ia_tokens_salida)}</td>
        <td class="num">${usd(d.costo_usd, 4)}</td>
        <td class="num">${num(d.contactos)}</td></tr>`).join('') || '<tr><td colspan="8" class="vacio">Sin documentos analizados en el período</td></tr>';
    },

    async adjudicaciones(p) {
      p.innerHTML = encabezado({ titulo: 'Adjudicaciones', descripcion: 'Quién se adjudicó cada licitación y compra ágil, con su OC.', icono: 'award' }) + `
        <div class="filtros">
          <select id="fTipo" aria-label="Tipo de proceso"><option value="">Todos los tipos</option><option value="COMPRA_AGIL">Compra ágil</option><option value="LICITACION_PUBLICA">Licitación pública</option><option value="LICITACION_PRIVADA">Licitación privada</option></select>
          <input id="fRut" placeholder="RUT comprador o proveedor" aria-label="RUT" />
          <button class="btn primario" id="fBuscar">${icono('search')}Buscar</button>
        </div>
        <div class="tabla"><table><thead><tr><th>Proceso</th><th>Comprador (deudor)</th><th>Adjudicado (vendedor)</th><th>OC</th><th class="num">Monto</th><th>Origen</th></tr></thead><tbody id="tAdj"></tbody></table></div>`;
      const cargar = async () => {
        const qs = new URLSearchParams({ limit: '100' });
        if ($('#fTipo').value) qs.set('tipo', $('#fTipo').value);
        if ($('#fRut').value) qs.set('rut', $('#fRut').value);
        const { data } = await api('/consultas/adjudicaciones?' + qs);
        const tono = { FICHA_COMPRA_AGIL: 'info', ORDEN_COMPRA: 'ok' };
        $('#tAdj').innerHTML = data.map((a) => `<tr>
          <td><a class="nowrap" href="${esc(a.proceso_link)}" target="_blank" rel="noopener">${esc(a.proceso_codigo)}</a><span class="sub">${esc((a.proceso_nombre || '').slice(0, 70))}</span></td>
          <td>${esc(a.comprador_nombre || '—')}<span class="sub nowrap">${esc(a.comprador_rut || '')}</span></td>
          <td>${esc(a.proveedor_nombre || '—')}<span class="sub nowrap">${esc(a.proveedor_rut)}</span></td>
          <td class="nowrap">${a.orden_compra_codigo ? `<a href="${esc(a.orden_compra_link)}" target="_blank" rel="noopener">${esc(a.orden_compra_codigo)}</a><span class="sub">${fecha(a.orden_compra_fecha_envio)}</span>` : '<span class="sub">Sin OC</span>'}</td>
          <td class="num">$ ${num(a.monto)}</td>
          <td>${badge(tono[a.origen] || 'neutro', a.origen.toLowerCase().replace(/_/g, ' '))}</td></tr>`).join('') || '<tr><td colspan="6" class="vacio">Sin adjudicaciones con ese filtro</td></tr>';
      };
      $('#fBuscar').onclick = () => cargar().catch((e) => avisar(e.message, true));
      await cargar();
    },

    async contactos(p) {
      p.innerHTML = encabezado({ titulo: 'Contactos', descripcion: 'Correos y teléfonos del comprador (deudor) y del proveedor (vendedor).', icono: 'users' }) + `
        <div class="filtros">
          <select id="fRol" aria-label="Rol"><option value="">Todos los roles</option><option value="COMPRADOR">Comprador (deudor)</option><option value="PROVEEDOR">Proveedor (vendedor)</option><option value="DESCONOCIDO">Sin rol claro</option></select>
          <select id="fConf" aria-label="Confianza mínima"><option value="">Cualquier confianza</option><option value="0.7">70% o más</option><option value="0.9">90% o más</option></select>
          <button class="btn primario" id="fBuscar">${icono('search')}Buscar</button>
        </div>
        <div class="tabla"><table><thead><tr><th>RUT</th><th>Rol</th><th>Nombre / cargo</th><th>Correo</th><th>Teléfono</th><th>Fuente y origen</th><th class="num">Confianza</th></tr></thead><tbody id="tCont"></tbody></table></div>`;
      const rol = { COMPRADOR: ['info', 'Comprador'], PROVEEDOR: ['ok', 'Proveedor'], DESCONOCIDO: ['neutro', 'Sin rol'] };
      // Dónde verificar el dato: la ficha pública de la OC o el proceso del documento (con su nombre).
      const origenContacto = (c) => {
        const o = c.origen;
        if (!o) return `<span class="sub" title="${esc(c.evidencia)}">${esc((c.evidencia || '').slice(0, 60))}</span>`;
        const enlace = o.link ? `<a class="nowrap" href="${esc(o.link)}" target="_blank" rel="noopener">${esc(o.codigo)}</a>` : esc(o.codigo);
        if (o.tipo === 'OC') return `<span class="sub nowrap">OC ${enlace}</span>`;
        const queDoc = { OFERTA: 'anexo del oferente', COTIZACION: 'cotización', BASES: 'bases' }[o.documentoOrigen] || 'documento';
        return `<span class="sub">${esc(o.documento)} (${queDoc}) · ${enlace}</span>`;
      };
      const fuente = { FICHA_OC: 'Ficha OC', FICHA_LICITACION: 'Ficha licitación', DOCUMENTO: 'Documento', DOCUMENTO_IA: 'Documento (IA)' };
      const cargar = async () => {
        const qs = new URLSearchParams({ limit: '100' });
        if ($('#fRol').value) qs.set('rol', $('#fRol').value);
        if ($('#fConf').value) qs.set('minConfianza', $('#fConf').value);
        const { data } = await api('/consultas/contactos?' + qs);
        $('#tCont').innerHTML = data.map((c) => `<tr>
          <td class="nowrap mono">${esc(c.rut || '—')}</td>
          <td>${badge(rol[c.rol][0], rol[c.rol][1])}</td>
          <td>${esc(c.nombre || '—')}<span class="sub">${esc(c.cargo || '')}</span></td>
          <td>${c.email ? `<a href="mailto:${esc(c.email)}">${esc(c.email)}</a>` : '—'}</td>
          <td class="nowrap">${esc(c.telefono || '—')}</td>
          <td>${esc(fuente[c.fuente] || c.fuente)}${origenContacto(c)}</td>
          <td class="num">${Math.round(c.confianza * 100)}%</td></tr>`).join('') || '<tr><td colspan="7" class="vacio">Sin contactos todavía</td></tr>';
      };
      $('#fBuscar').onclick = () => cargar().catch((e) => avisar(e.message, true));
      await cargar();
    },

    async 'datos-abiertos'(p) {
      p.innerHTML = encabezado({ titulo: 'Datos abiertos', descripcion: 'Descarga masiva por URL: un .zip por tipo y mes. Se reprocesa solo si cambió el ETag.', icono: 'database', acciones: `<button class="btn" data-recargar>${icono('refresh')}Recargar</button>` }) + '<div class="tabla"><div class="meses" id="meses"></div></div>';
      const { data } = await api('/datos-abiertos/estado');
      const filas = {};
      for (const m of data) (filas[`${m.tipo} ${m.anio}`] ??= {})[m.mes] = m;
      let html = '<div></div>' + MESES.map((m) => `<div class="cab-mes">${m}</div>`).join('');
      for (const [clave, meses] of Object.entries(filas)) {
        const [tipo, anio] = clave.split(' ');
        html += `<div><b>${tipo === 'OC' ? 'Órdenes' : 'Licitaciones'}</b><span class="sub">${anio}</span></div>`;
        for (let mes = 1; mes <= 12; mes++) {
          const m = meses[mes];
          if (!m) { html += '<div></div>'; continue; }
          const texto = { FALTA: 'Falta', OK: 'OK', ERROR: 'Error', PROCESANDO: 'Procesando', DESCARGANDO: 'Bajando', PENDIENTE: 'Pendiente' }[m.estado] || m.estado;
          html += `<div class="mes ${m.estado}" title="${esc(m.error || m.url)}"><b>${texto}</b>${m.filasLeidas ? num(m.filasLeidas) : '&nbsp;'}<br><button class="btn" data-tipo="${tipo}" data-anio="${anio}" data-mes="${mes}" data-forzar="${m.estado === 'OK'}">${m.estado === 'OK' ? 'Forzar' : 'Procesar'}</button></div>`;
        }
      }
      $('#meses').innerHTML = html;
      $('#meses').onclick = async (e) => {
        const b = e.target.closest('button'); if (!b) return;
        try {
          const r = await api(`/datos-abiertos/archivos/${b.dataset.tipo}/${b.dataset.anio}/${b.dataset.mes}${b.dataset.forzar === 'true' ? '?forzar=true' : ''}`, { method: 'POST' });
          avisar(r.message); setTimeout(render, 1500);
        } catch (err) { avisar(err.message, true); }
      };
    },

    async 'cron-jobs'(p) {
      p.innerHTML = encabezado({ titulo: 'Cron Jobs', descripcion: 'Tareas programadas: pausar, disparar a mano o cambiar el horario.', icono: 'clock', acciones: `<button class="btn" data-recargar>${icono('refresh')}Recargar</button>` }) +
        '<div class="tabla"><table><thead><tr><th>Tarea</th><th>Horario</th><th>Última ejecución</th><th>Próxima</th><th>Estado</th><th></th></tr></thead><tbody id="tCron"></tbody></table></div>';
      const { data } = await api('/cron-jobs');
      $('#tCron').innerHTML = data.map((j) => `<tr>
        <td><span style="font-weight:500">${esc(j.name)}</span><span class="sub">${esc(j.description)}</span></td>
        <td class="nowrap"><code>${esc(j.activeSchedule)}</code>${j.scheduleOverride ? ' ' + badge('warn', 'Override') : ''}<span class="sub">${esc(j.activeTimeZone || 'Hora del servidor')}</span></td>
        <td class="nowrap">${j.lastRun ? estadoRun(j.lastRun.status) + `<span class="sub">${fecha(j.lastRun.startedAt)}${j.lastRun.durationMs != null ? ' · ' + Math.round(j.lastRun.durationMs / 1000) + ' s' : ''}</span>` : '<span class="sub">Sin ejecuciones</span>'}</td>
        <td class="nowrap">${j.state === 'paused' ? '<span class="sub">Pausado</span>' : fecha(j.nextRun)}</td>
        <td>${j.state === 'paused' ? badge('warn', 'Pausado') : badge('ok', 'Activo')}</td>
        <td><div class="acciones" style="flex-wrap:nowrap">
          <button class="btn fantasma" data-run="${esc(j.name)}" title="Ejecutar ahora" aria-label="Ejecutar ${esc(j.name)}">${icono('play')}</button>
          <button class="btn fantasma" data-toggle="${esc(j.name)}" data-state="${j.state}" title="${j.state === 'paused' ? 'Reanudar' : 'Pausar'}" aria-label="${j.state === 'paused' ? 'Reanudar' : 'Pausar'} ${esc(j.name)}">${icono(j.state === 'paused' ? 'refresh' : 'pause')}</button>
          <button class="btn fantasma" data-horario="${esc(j.name)}" data-actual="${esc(j.activeSchedule)}" title="Editar horario" aria-label="Editar horario de ${esc(j.name)}">${icono('pencil')}</button>
          <button class="btn fantasma" data-hist="${esc(j.name)}" title="Historial" aria-label="Historial de ${esc(j.name)}">${icono('history')}</button>
        </div></td></tr>`).join('');
      $('#tCron').onclick = async (e) => {
        const b = e.target.closest('button'); if (!b) return;
        try {
          if (b.dataset.run) { const r = await api(`/cron-jobs/${b.dataset.run}/trigger`, { method: 'POST' }); avisar(r.message || 'Disparado'); }
          if (b.dataset.toggle) await api(`/cron-jobs/${b.dataset.toggle}`, { method: 'PATCH', body: JSON.stringify({ state: b.dataset.state === 'paused' ? 'active' : 'paused' }) });
          if (b.dataset.horario) {
            $('#modalTitulo').textContent = 'Horario · ' + b.dataset.horario;
            $('#modalCron').value = b.dataset.actual;
            $('#modal').showModal();
            const valor = await new Promise((r) => $('#modal').addEventListener('close', () => r($('#modal').returnValue), { once: true }));
            if (valor !== 'guardar') return;
            const nuevo = $('#modalCron').value.trim();
            await api(`/cron-jobs/${b.dataset.horario}`, { method: 'PATCH', body: JSON.stringify(nuevo ? { schedule: nuevo } : { resetSchedule: true }) });
          }
          if (b.dataset.hist) {
            const r = await api(`/cron-jobs/${b.dataset.hist}/runs?limit=20`);
            $('#sheetTitulo').textContent = 'Historial · ' + b.dataset.hist;
            $('#sheetCuerpo').innerHTML = r.data.map((x) => `<div class="corrida"><div class="fila"><span>${estadoRun(x.status)} <span class="sub" style="display:inline">${x.triggeredBy === 'MANUAL' ? 'Manual' : 'Programada'}</span></span><span class="sub" style="margin:0">${fecha(x.startedAt)} · ${x.durationMs != null ? Math.round(x.durationMs / 1000) + ' s' : '—'}</span></div>
              <span class="sub">Procesados: ${num(x.itemsProcessed)} · Con error: ${num(x.itemsFailed)}</span>
              ${x.errorMessage || x.metadata ? `<pre>${esc(x.errorMessage ?? JSON.stringify(x.metadata, null, 1))}</pre>` : ''}</div>`).join('') || '<div class="vacio">Sin ejecuciones</div>';
            $('#sheet').showModal();
          }
          if (!b.dataset.hist) await render();
        } catch (err) { avisar(err.message, true); }
      };
    },

    async parametros(p) {
      p.innerHTML = encabezado({ titulo: 'Parámetros', descripcion: 'Valores vivos de los crons. Se aplican en la próxima ejecución, sin redeploy.', icono: 'settings' }) +
        '<div class="tabla"><table><thead><tr><th>Parámetro</th><th>Valor</th><th>Descripción</th><th></th></tr></thead><tbody id="tPar"></tbody></table></div>';
      const { data } = await api('/configuracion');
      $('#tPar').innerHTML = data.map((x) => `<tr>
        <td class="nowrap"><code>${esc(x.clave)}</code>${x.modificado ? ' ' + badge('warn', 'Modificado') : ''}</td>
        <td>${typeof x.valor === 'boolean'
          ? `<select class="campo" data-param="${esc(x.clave)}" data-tipo="boolean" aria-label="${esc(x.clave)}"><option value="true" ${x.valor ? 'selected' : ''}>Sí</option><option value="false" ${!x.valor ? 'selected' : ''}>No</option></select>`
          : `<input class="campo" data-param="${esc(x.clave)}" data-tipo="number" type="number" value="${esc(x.valor)}" style="width:110px" aria-label="${esc(x.clave)}" />`}</td>
        <td>${esc(x.descripcion)}<span class="sub">Por defecto: ${esc(x.valorPorDefecto)}</span></td>
        <td><div class="acciones" style="flex-wrap:nowrap"><button class="btn primario" data-guardar="${esc(x.clave)}">Guardar</button>${x.modificado ? `<button class="btn" data-reset="${esc(x.clave)}">Restablecer</button>` : ''}</div></td></tr>`).join('');
      $('#tPar').onclick = async (e) => {
        const b = e.target.closest('button'); if (!b) return;
        try {
          if (b.dataset.guardar) {
            const c = document.querySelector(`[data-param="${b.dataset.guardar}"]`);
            await api(`/configuracion/${b.dataset.guardar}`, { method: 'PATCH', body: JSON.stringify({ valor: c.dataset.tipo === 'boolean' ? c.value === 'true' : Number(c.value) }) });
            avisar('Guardado: ' + b.dataset.guardar);
          }
          if (b.dataset.reset) await api(`/configuracion/${b.dataset.reset}`, { method: 'DELETE' });
          await render();
        } catch (err) { avisar(err.message, true); }
      };
    },
  };

  // ── Ruteo por hash: el ítem activo lleva el borde coral, como en el back office ──
  const rutaActual = () => (location.hash.replace(/^#\//, '') || 'resumen');
  async function render() {
    const ruta = vistas[rutaActual()] ? rutaActual() : 'resumen';
    document.querySelectorAll('.sb-item[data-ruta]').forEach((a) => { if (a.dataset.ruta === ruta) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const p = $('#pagina');
    try { await vistas[ruta](p); } catch (err) { avisar(err.message, true); }
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('[data-recargar]')) render();
    if (e.target.closest('[data-cerrar]')) e.target.closest('dialog').close();
  });
  $('#sheet').addEventListener('click', (e) => { if (e.target === $('#sheet')) $('#sheet').close(); });
  addEventListener('hashchange', render);
  render();
  setInterval(() => { if (!document.hidden && ['resumen', 'cron-jobs'].includes(rutaActual()) && !document.querySelector('dialog[open]')) render(); }, 30000);
})();
</script>
</body>
</html>
